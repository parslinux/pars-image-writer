<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <defs>
    <!-- Gradients -->
    <linearGradient id="main-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="banner-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Disc Gradients -->
    <radialGradient id="banner-disc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="75%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <linearGradient id="banner-holo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="75%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <!-- USB Gradients -->
    <linearGradient id="banner-usb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="banner-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="stream-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="banner-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="banner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Pill Background -->
  <rect x="6" y="6" width="308" height="108" rx="22" fill="url(#main-bg)" filter="url(#banner-shadow)"/>
  <rect x="6.5" y="6.5" width="307" height="107" rx="21.5" fill="none" stroke="url(#banner-border)" stroke-width="1.2"/>

  <!-- Background Data Grid Accent -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <line x1="6" y1="36" x2="314" y2="36"/>
    <line x1="6" y1="60" x2="314" y2="60"/>
    <line x1="6" y1="84" x2="314" y2="84"/>
    <line x1="80" y1="6" x2="80" y2="114"/>
    <line x1="160" y1="6" x2="160" y2="114"/>
    <line x1="240" y1="6" x2="240" y2="114"/>
  </g>

  <!-- ==================== LEFT: ISO DISC ==================== -->
  <g transform="translate(68, 60)">
    <!-- Ambient disc shadow -->
    <circle cx="0" cy="0" r="38" fill="#000000" opacity="0.4"/>

    <!-- Outer disc ring -->
    <circle cx="0" cy="0" r="35" fill="url(#banner-disc)" stroke="#38bdf8" stroke-width="1.2"/>

    <!-- Holographic rainbow track -->
    <circle cx="0" cy="0" r="27" fill="none" stroke="url(#banner-holo)" stroke-width="10" opacity="0.8"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#818cf8" stroke-width="0.5" opacity="0.6"/>

    <!-- Gloss Sheen -->
    <path d="M 0 0 L -24 -24 A 35 35 0 0 1 0 -35 Z" fill="#ffffff" opacity="0.14"/>
    <path d="M 0 0 L 24 24 A 35 35 0 0 1 0 35 Z" fill="#ffffff" opacity="0.14"/>

    <!-- Center Hub & Hole -->
    <circle cx="0" cy="0" r="13" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <circle cx="0" cy="0" r="9" fill="#1e293b"/>
    <circle cx="0" cy="0" r="5" fill="#090d16" stroke="#38bdf8" stroke-width="0.8"/>

    <!-- ISO Badge Pill -->
    <rect x="-18" y="22" width="36" height="13" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" opacity="0.95"/>
    <text x="0" y="31.5" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="1">ISO</text>
  </g>

  <!-- ==================== CENTER: HIGH-SPEED WRITE STREAM ==================== -->
  <g transform="translate(160, 60)">
    <!-- Flow Beam Lines -->
    <path d="M -45 0 L 45 0" stroke="url(#stream-gradient)" stroke-width="3" stroke-linecap="round"/>
    <path d="M -40 -12 Q -10 -20 30 -6" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
    <path d="M -40 12 Q -10 20 30 6" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

    <!-- Flow Particles / Glowing Chevrons -->
    <g filter="url(#banner-glow)">
      <path d="M -22 -10 L -12 0 L -22 10" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
      <path d="M -7 -12 L 5 0 L -7 12" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
      <path d="M 8 -14 L 22 0 L 8 14" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Speed / Transfer Badge -->
    <rect x="-24" y="-34" width="48" height="12" rx="3.5" fill="#0284c7" opacity="0.25"/>
    <text x="0" y="-25" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="bold" fill="#00f2fe" text-anchor="middle" letter-spacing="0.8">STREAM</text>
  </g>

  <!-- ==================== RIGHT: USB FLASH DRIVE ==================== -->
  <g transform="translate(248, 60)">
    <!-- USB Shadow -->
    <rect x="-42" y="-17" width="76" height="34" rx="7" fill="#000000" opacity="0.45" transform="translate(2, 3)"/>

    <!-- Metallic Connector Head (Left-facing toward stream) -->
    <rect x="-44" y="-10" width="18" height="20" rx="2" fill="url(#banner-metal)" stroke="#475569" stroke-width="0.8"/>
    <!-- Connector Depth Cutouts -->
    <rect x="-41" y="-7" width="5.5" height="4.5" rx="0.5" fill="#1e293b"/>
    <rect x="-41" y="2.5" width="5.5" height="4.5" rx="0.5" fill="#1e293b"/>

    <!-- Connector Base Collar -->
    <rect x="-28" y="-12" width="4.5" height="24" rx="1" fill="#334155" stroke="#1e293b" stroke-width="0.5"/>

    <!-- USB Main Casing -->
    <rect x="-25" y="-16" width="56" height="32" rx="6" fill="url(#banner-usb)" stroke="#38bdf8" stroke-width="1.2"/>

    <!-- High-gloss Top Spine -->
    <rect x="-23" y="-13.5" width="52" height="5.5" rx="2" fill="#ffffff" opacity="0.3"/>

    <!-- USB 3.2 Symbol / Lightning Write Glyph -->
    <path d="M 2 -7 L -4 1 L 0 1 L -2 9 L 6 -1 L 2 -1 Z" fill="#ffffff" opacity="0.95"/>

    <!-- LED Activity Indicator -->
    <circle cx="20" cy="0" r="3" fill="#10b981" filter="url(#banner-glow)"/>
    <circle cx="20" cy="0" r="1.5" fill="#a7f3d0"/>

    <!-- Lanyard Loop -->
    <path d="M 31 -7 C 35 -7, 35 7, 31 7" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>

    <!-- USB Badge Pill -->
    <rect x="-17" y="22" width="34" height="13" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" opacity="0.95"/>
    <text x="0" y="31.5" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="1">USB</text>
  </g>
</svg>