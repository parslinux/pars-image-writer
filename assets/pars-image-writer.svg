<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <radialGradient id="ambient-glow" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Disc Gradients -->
    <radialGradient id="disc-body" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="35%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <linearGradient id="disc-holo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="disc-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3"/>
    </linearGradient>

    <!-- USB Drive Gradients -->
    <linearGradient id="usb-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#0ea5e9"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="usb-cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="75%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="data-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="1"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Squircle Canvas -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg-grad)" filter="url(#shadow)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#ambient-glow)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Subtle Grid Lines (Modern Tech Vibe) -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="8" y1="40" x2="120" y2="40"/>
    <line x1="8" y1="64" x2="120" y2="64"/>
    <line x1="8" y1="88" x2="120" y2="88"/>
    <line x1="40" y1="8" x2="40" y2="120"/>
    <line x1="64" y1="8" x2="64" y2="120"/>
    <line x1="88" y1="8" x2="88" y2="120"/>
  </g>

  <!-- ==================== ISO DISC (Left-Center) ==================== -->
  <g transform="translate(48, 64)">
    <!-- Outer Disc Shadow -->
    <circle cx="0" cy="0" r="32" fill="#020617" opacity="0.6"/>

    <!-- Disc Base -->
    <circle cx="0" cy="0" r="30" fill="url(#disc-body)" stroke="url(#disc-rim)" stroke-width="1.2"/>

    <!-- Holographic Data Ring (Rainbow Refraction) -->
    <circle cx="0" cy="0" r="23" fill="none" stroke="url(#disc-holo)" stroke-width="9" opacity="0.75"/>
    <circle cx="0" cy="0" r="27.5" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="18.5" fill="none" stroke="#818cf8" stroke-width="0.5" opacity="0.6"/>

    <!-- Light Sheen Wedges -->
    <path d="M 0 0 L -21 -21 A 30 30 0 0 1 0 -30 Z" fill="#ffffff" opacity="0.12"/>
    <path d="M 0 0 L 21 21 A 30 30 0 0 1 0 30 Z" fill="#ffffff" opacity="0.12"/>

    <!-- Center Hub -->
    <circle cx="0" cy="0" r="11" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <circle cx="0" cy="0" r="8" fill="#1e293b"/>
    <!-- Center Spindle Hole -->
    <circle cx="0" cy="0" r="4.5" fill="#090d16" stroke="#38bdf8" stroke-width="0.7" opacity="0.9"/>
  </g>

  <!-- ==================== DATA WRITE BEAM (Pulse Arrows) ==================== -->
  <g filter="url(#glow)">
    <!-- Write Stream Chevrons -->
    <path d="M 52 57 L 58 64 L 52 71" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    <path d="M 60 55 L 68 64 L 60 73" fill="none" stroke="#00f2fe" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <path d="M 68 53 L 78 64 L 68 75" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ==================== USB FLASH DRIVE (Right-Center) ==================== -->
  <g transform="translate(86, 64)">
    <!-- Drop Shadow under USB Drive -->
    <rect x="-14" y="-36" width="26" height="72" rx="7" fill="#000000" opacity="0.45" transform="translate(2, 4)"/>

    <!-- Metallic Connector (Type-A) -->
    <rect x="-9" y="-35" width="16" height="15" rx="2" fill="url(#usb-cap)" stroke="#475569" stroke-width="0.75"/>
    <!-- Connector Inner Depth -->
    <rect x="-7" y="-34" width="12" height="4" rx="1" fill="#1e293b" opacity="0.8"/>
    <!-- USB Pin Cutouts -->
    <rect x="-6" y="-27" width="3.5" height="4.5" rx="0.5" fill="#0f172a"/>
    <rect x="0.5" y="-27" width="3.5" height="4.5" rx="0.5" fill="#0f172a"/>

    <!-- Connector Base Collar -->
    <rect x="-11" y="-22" width="20" height="4" rx="1.5" fill="#334155" stroke="#1e293b" stroke-width="0.5"/>

    <!-- USB Drive Main Body -->
    <rect x="-12" y="-19" width="22" height="52" rx="6" fill="url(#usb-body)" stroke="#38bdf8" stroke-width="1"/>

    <!-- Glossy Highlight Spine -->
    <rect x="-8" y="-17" width="4" height="48" rx="2" fill="#ffffff" opacity="0.25"/>

    <!-- Lightning / Write Glyph -->
    <path d="M 0 -9 L -5 3 L -1 3 L -3 14 L 5 1 L 1 1 Z" fill="#ffffff" opacity="0.95"/>

    <!-- LED Activity Indicator -->
    <circle cx="-1" cy="22" r="2.2" fill="#10b981" filter="url(#glow)"/>
    <circle cx="-1" cy="22" r="1.2" fill="#a7f3d0"/>

    <!-- Lanyard Loop Base -->
    <path d="M -7 33 C -7 36, 5 36, 5 33" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -5 33 C -5 35.5, 3 35.5, 3 33" fill="none" stroke="#0f172a" stroke-width="1"/>
  </g>

  <!-- Sparkle Accent at top-right of USB -->
  <g transform="translate(100, 26)" opacity="0.9">
    <path d="M 0 -4 L 1 -1 L 4 0 L 1 1 L 0 4 L -1 1 L -4 0 L -1 -1 Z" fill="#38bdf8"/>
    <circle cx="0" cy="0" r="1" fill="#ffffff"/>
  </g>
</svg>
