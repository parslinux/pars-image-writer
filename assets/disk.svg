<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- USB Gradients -->
    <linearGradient id="disk-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#0ea5e9"/>
      <stop offset="75%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="disk-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="75%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <filter id="disk-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="led-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Shadow -->
  <rect x="15" y="6" width="18" height="38" rx="5" fill="#000000" opacity="0.3" transform="translate(1, 2)"/>

  <!-- Entire USB Drive Group -->
  <g filter="url(#disk-shadow)">
    <!-- Metallic USB Connector (Type-A) -->
    <rect x="17.5" y="5" width="13" height="11" rx="1.5" fill="url(#disk-metal)" stroke="#475569" stroke-width="0.75"/>

    <!-- Connector Inner Recess -->
    <rect x="19" y="5.5" width="10" height="3" rx="0.75" fill="#1e293b" opacity="0.75"/>

    <!-- Dual Connector Pin Cutouts -->
    <rect x="19.5" y="10.5" width="3" height="3.5" rx="0.5" fill="#0f172a"/>
    <rect x="25.5" y="10.5" width="3" height="3.5" rx="0.5" fill="#0f172a"/>

    <!-- Connector Base Collar -->
    <rect x="16" y="14.5" width="16" height="3" rx="1" fill="#334155" stroke="#1e293b" stroke-width="0.5"/>

    <!-- USB Main Body -->
    <rect x="15" y="17" width="18" height="25" rx="4.5" fill="url(#disk-body)" stroke="#38bdf8" stroke-width="0.9"/>

    <!-- Glossy Highlight Spine -->
    <rect x="17.5" y="18.5" width="3.5" height="22" rx="1.5" fill="#ffffff" opacity="0.28"/>

    <!-- Activity LED Pill -->
    <circle cx="24" cy="27" r="2.2" fill="#10b981" filter="url(#led-glow)"/>
    <circle cx="24" cy="27" r="1.1" fill="#a7f3d0"/>

    <!-- High-speed Write Symbol (Chevron / Lightning) -->
    <path d="M 23 32 L 25 34 L 23 36" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <!-- Lanyard Loop Base -->
    <path d="M 19 41.5 C 19 44, 29 44, 29 41.5" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
    <path d="M 21 41.5 C 21 43.2, 27 43.2, 27 41.5" fill="none" stroke="#0f172a" stroke-width="0.8"/>
  </g>
</svg>
