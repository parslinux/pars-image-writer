<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Disc Gradients -->
    <radialGradient id="iso-body" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="45%" stop-color="#334155"/>
      <stop offset="80%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <linearGradient id="iso-holo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#818cf8"/>
      <stop offset="55%" stop-color="#c084fc"/>
      <stop offset="80%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <linearGradient id="iso-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="iso-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Shadow -->
  <circle cx="24" cy="25" r="20" fill="#000000" opacity="0.3"/>

  <!-- Disc Base -->
  <circle cx="24" cy="24" r="20" fill="url(#iso-body)" stroke="url(#iso-rim)" stroke-width="1.2" filter="url(#iso-shadow)"/>

  <!-- Holographic Track Ring -->
  <circle cx="24" cy="24" r="15" fill="none" stroke="url(#iso-holo)" stroke-width="6" opacity="0.85"/>
  <circle cx="24" cy="24" r="18" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.6"/>
  <circle cx="24" cy="24" r="12" fill="none" stroke="#818cf8" stroke-width="0.5" opacity="0.6"/>

  <!-- Light Sheen Reflection Wedges -->
  <path d="M 24 24 L 10 10 A 20 20 0 0 1 24 4 Z" fill="#ffffff" opacity="0.16"/>
  <path d="M 24 24 L 38 38 A 20 20 0 0 1 24 44 Z" fill="#ffffff" opacity="0.16"/>

  <!-- Center Hub Ring -->
  <circle cx="24" cy="24" r="7.5" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <circle cx="24" cy="24" r="5.5" fill="#1e293b"/>

  <!-- Center Spindle Hole -->
  <circle cx="24" cy="24" r="3" fill="#020617" stroke="#38bdf8" stroke-width="0.75"/>

  <!-- Small Optical Laser Sparkle -->
  <circle cx="16" cy="18" r="1" fill="#38bdf8" opacity="0.9"/>
</svg>
